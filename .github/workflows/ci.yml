name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mathlib_bsu
          POSTGRES_USER: mathlib_user
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mathlib_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "True"
      DB_NAME: mathlib_bsu
      DB_USER: mathlib_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --parallel auto -v 2

  production-checks:
    name: Production configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: example.tj
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate throwaway SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      - name: Collect static files (WhiteNoise manifest)
        run: python manage.py collectstatic --noinput

      - name: Deployment checklist
        # Fails on errors; warnings (e.g. HSTS, not yet env-configurable) are reported.
        run: python manage.py check --deploy --fail-level ERROR

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
