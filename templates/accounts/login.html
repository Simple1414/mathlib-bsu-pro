{% extends 'base.html' %}
{% block title %}Воридшавӣ{% endblock %}
{% block content %}
<section class="container section narrow">
    <div class="panel auth-panel">
        <h1>Воридшавӣ</h1>
        <form method="post">
            {% csrf_token %}
            {% include 'includes/form.html' %}
            <button class="btn" type="submit">Ворид шудан</button>
        </form>
        <p class="muted">Ҳисоб надоред? <a href="{% url 'accounts:register' %}">Бақайдгирӣ</a></p>
    </div>
</section>
{% endblock %}
