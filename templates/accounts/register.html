{% extends 'base.html' %}
{% block title %}Бақайдгирӣ{% endblock %}
{% block content %}
<section class="container section narrow">
    <div class="panel">
        <h1>Бақайдгирии корбар</h1>
        <p class="muted">Номи донишгоҳ, факултет ва ихтисосро худатон навишта метавонед. Нақши корбари нав ба таври худкор “Донишҷӯ” мешавад.</p>
        <form method="post">
            {% csrf_token %}
            {% include 'includes/form.html' %}
            <button class="btn" type="submit">Сабт шудан</button>
        </form>
    </div>
</section>
{% endblock %}
